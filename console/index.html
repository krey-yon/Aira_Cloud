<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#070812" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)" />
    <title>Aira Cloud</title>
    <link rel="icon" href="./aira-mark.svg" type="image/svg+xml" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("aira-theme");
          const theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch {}
      })();
    </script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./app.tsx"></script>
  </body>
</html>
